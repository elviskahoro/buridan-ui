  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C",
  "C4",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "FIX",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "NPY",
  "PIE",
  "PGH",
  "PD",
  "PL",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RSE",
  "RET",
  "RUF",
  "S",
  "SLF",
  "SIM",
  "TCH",
  "TD",
  "TID",
  "T10",
  "TRY",
  "W",
  "UP",
]
ignore = [
  "ANN101",
  "B008",
  "C901",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D203",
  "D205",
  "D213",
  "D401",
  "D406",
  "D407",
  "D417",
  "E401",
  "E501",
  "ERA001",
  "F403",
  "F405",
  "F541",
  "FA102",
  "FIX002",
  "PIE807",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "N815",
  "RUF100",
  # SIM300's autofix emits a fix object with a null message, which crashes
  # trunk 1.25.0's ruff JSON parser ("type must be string, but is null") --
  # including on trunk's upstream scan of base commits that still carry a
  # SIM300 violation, which would deadlock any PR that fixes one. Latent in
  # gtm-sdk (that repo is ruff-clean); fatal here while main has SIM300
  # findings. Drop this ignore once trunk fixes the parser.
  "SIM300",
  "UP037",
]

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-sort-within-sections = false
force-wrap-aliases = true
order-by-type = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# assert is pytest's normal check mechanism, not a production safety bypass.
# ANN401: Any is legitimate for pytest fixtures and dynamic mocking
# FBT001: Boolean parameters are common in pytest parametrize decorators
"tests/**" = ["S101", "ANN401", "FBT001"]
# Reflex event handlers are called positionally; value=<bool> breaks handlers
# whose parameter isn't named `value`, and component source ships verbatim.
"components/**" = ["FBT003"]
# Generation and utility scripts don't require full type annotation overhead.
"scripts/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN206"]
# Auto-generated example modules use implicit namespace packages.
"app/www/library/examples/**" = ["INP001"]
