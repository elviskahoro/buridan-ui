  "FA102",
  "FIX002",
  "PIE807",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "N815",
  "RUF100",
  # SIM300's autofix emits a fix object with a null message, which crashes
  # trunk 1.25.0's ruff JSON parser ("type must be string, but is null") --
  # including on trunk's upstream scan of base commits that still carry a
  # SIM300 violation, which would deadlock any PR that fixes one. Latent in
  # gtm-sdk (that repo is ruff-clean); fatal here while main has SIM300
  # findings. Drop this ignore once trunk fixes the parser.
  "SIM300",
  "UP037",
]

[lint.flake8-annotations]
# Pass-through *args/**kwargs (Reflex children/props, decorator wrappers) are
# genuinely Any; ANN401 still flags Any on ordinary parameters.
allow-star-arg-any = true

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-sort-within-sections = false
force-wrap-aliases = true
order-by-type = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Ignores are scoped to semantically grouped directories, never single files.
# Reflex-specific ignores apply only to directories of Reflex UI code.

# assert is pytest's normal check mechanism, not a production safety bypass.
# Mocks of Reflex/Python callables take and return Any.
"tests/**" = ["S101", "ANN401"]

# --- Reflex UI code ---
# Reflex event handlers are called positionally; value=<bool> breaks handlers
# whose parameter isn't named `value`, and component source ships verbatim.
# A004: the input component is named `input`, shadowing the builtin.
# RUF012: mutable class-level defaults are how Reflex components declare props.
"components/**" = ["FBT003", "A004", "RUF012"]
# A004: these compose the `input` component from components/ui.
"app/anatomy_src/**" = ["A004"]
"app/examples/**" = ["A004"]
"app/templates/**" = ["A004"]
# Example modules are discovered by directory scan and imported dynamically
# (app/www/parser.py), so they need no __init__.py. A004 as above.
"app/www/library/examples/**" = ["INP001", "A004"]
# ClientStateVar handles are intentionally capitalized.
"app/www/library/charts/**" = ["N806"]

# --- Developer tooling ---
# Generation scripts don't need full type annotations. Complexity limits are
# deferred until the long generators are split up (#134, #209).
"scripts/**" = ["ANN001", "ANN202", "PLR0911", "PLR0912", "PLR0915"]
# Typer command bodies branch on many options; refactoring deferred (#134).
"cli/**" = ["PLR0912", "PLR0915"]
