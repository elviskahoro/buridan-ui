name: Docs & Assets

on:
  push:
    branches:
      - main
      - trunk-merge/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-generated-assets:
    name: Generate & Verify Docs and Social Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate anatomy compositions
        run: uv run python scripts/generate_anatomy.py --check

      - name: Generate markdown files
        run: uv run python scripts/generate_markdown.py

      - name: Check for uncommitted changes
        run: git diff --exit-code assets/docs

      - name: Run asset verification tests
        run: uv run pytest tests/test_generated_assets.py tests/test_toc_scrollspy.py
