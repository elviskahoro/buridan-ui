name: release

# Creates the GitHub release for each version tag. PyPI publishing stays in
# .rwx/publish.yml; RWX's github.token is read-only, so releases live here
# where the built-in GITHUB_TOKEN can write them. Releases are notes-only;
# artifacts ship via PyPI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Don't announce a version PyPI never received: RWX publishes in
          # parallel, so wait for the upload to land (up to ~20 min). If it misses
          # the window, re-run this job from the Actions UI once PyPI has it.
          version="${TAG#v}"
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/gtm-ui-buridan/${version}/json" && break
            sleep 30
          done
          curl -fsS -o /dev/null "https://pypi.org/pypi/gtm-ui-buridan/${version}/json" \
            || { echo "gtm-ui-buridan ${version} not on PyPI; skipping release" >&2; exit 1; }
          # Idempotent: re-running a tag must not fail on an existing release.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
