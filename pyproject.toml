[project]
name = "gtm-ui-buridan"
version = "0.1.21"
description = "A command line interface (CLI) for adding components and themes to your project."
requires-python = ">=3.11"
dependencies = []

readme = "cli/README.md"
license = "MIT"

authors = [{ name = "Buridan UI" }]

keywords = [
  "cli",
  "ui",
  "design-system",
  "reflex",
  "components",
  "tailwind",
  "base-ui",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/elviskahoro/buridan-ui"
Repository = "https://github.com/elviskahoro/buridan-ui"
Issues = "https://github.com/elviskahoro/buridan-ui/issues"

[dependency-groups]
dev = [
  "reflex==0.10.0",
  "reflex-hosting-cli>=0.1.67",
  "pillow>=12.2.0",
  "PyYAML>=6.0.3",
  "types-PyYAML>=6.0.3",
  "questionary>=2.1.1",
  "pytest>=9.1.1",
  "gtm-linear>=0.2.1",
  "typer>=0.27.2",
  # Pre-staged for httpx → httpx2 migration (see #198). Not yet imported;
  # blocked on upstream (reflex) migrating first. Intentional dependency.
  "httpx2>=2.13.1",
]

[tool.uv]
prerelease = "allow"
exclude-newer = "7 days"

[project.scripts]
buridan = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli", "components"]
